name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node -e "JSON.parse(require('fs').readFileSync('site/apps.json','utf8'))"
      - run: docker build -t raccfo:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name raccfo -p 8080:8080 raccfo:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q raccfo
          curl -fs localhost:8080/api/apps | grep -q bingebandit
